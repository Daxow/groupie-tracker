<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Groupie Tracker</h1>

<div class="search-container">
    <form class="search" action="/search" method="GET">
        <input type="text" id="searchInput" name="query" placeholder="Rechercher..." value="{{.Query}}">
        <button type="submit">Rechercher</button>
    </form>

    <div id="suggestions" class="suggestions"></div>
</div>

<div class="artists">
    {{range .Artists}}
    <div class="image">
        <img src="{{.Image}}">
        <h2>{{.Name}}</h2>
        <p>Créé en {{.CreationDate}}</p>
        <p>Premier album : {{.FirstAlbum}}</p>
        <p>Membres :</p>
        <p> {{range .Members}}{{.}}, {{end}}</p>
        <p>Lieux de concert :</p>
        <p>{{range .Locations}}{{.}}, {{end}}</p>
    </div>
    {{end}}
</div>

<script src="/static/script.js"></script>

</body>
</html>
